<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#faf6ee" />
    <script>
      // Pick the theme before the page draws (see src/lib/theme.ts): a saved choice, else the device's.
      ;(() => {
        let saved = null
        try {
          saved = localStorage.getItem('firstpr-theme')
        } catch {}
        const media = matchMedia('(prefers-color-scheme: dark)')
        const apply = (theme) => {
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#16140f' : '#faf6ee')
        }
        apply(saved === 'light' || saved === 'dark' ? saved : media.matches ? 'dark' : 'light')
        // No saved choice yet: keep following the device if it switches (e.g. at sunset).
        media.addEventListener('change', (e) => {
          let chosen = null
          try {
            chosen = localStorage.getItem('firstpr-theme')
          } catch {}
          if (!chosen) apply(e.matches ? 'dark' : 'light')
        })
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find open-source issues you can actually fix: open, unclaimed, in active repos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>FirstPR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
