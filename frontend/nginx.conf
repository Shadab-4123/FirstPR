# Same job as the Vite dev proxy: one origin for the browser,
# /api/* goes to FastAPI, everything else is the React app.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (e.g. /issues/123) must all serve index.html.
    location / {
        try_files $uri /index.html;
    }

    # Vite puts a content hash in asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
