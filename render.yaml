# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The database stays on Supabase; Render only runs the API and the static site.
services:
  - type: web
    name: firstpr-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free  # sleeps after ~15 min idle; first request then takes ~30-60 s
    region: singapore  # closest Render region to the Supabase DB in Mumbai
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL  # Supabase pooler URL, entered in the dashboard
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: firstpr-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Same origin for the browser: /api/* is forwarded to the API service.
      # If Render gives the API a different URL than below, update it here.
      - type: rewrite
        source: /api/*
        destination: https://firstpr-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
