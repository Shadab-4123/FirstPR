# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The database stays on Supabase; Render only runs the API and the static site.
services:
  - type: web
    name: firstpr-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free  # sleeps after ~15 min idle; first request then takes ~30-60 s
    region: singapore  # closest Render region to the Supabase DB in Mumbai
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL  # Supabase pooler URL, entered in the dashboard
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # GitHub sign-in (see backend/.env.example). Values are entered in the dashboard.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        value: https://firstpr-web.onrender.com

  - type: web
    name: firstpr-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Same origin for the browser: /api/* is forwarded to the API service.
      # Render appended "-5lk3" because "firstpr-api" was already taken.
      - type: rewrite
        source: /api/*
        destination: https://firstpr-api-5lk3.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
