# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The database stays on Supabase; Render runs the API. The website is on Cloudflare Pages
# (https://firstpr.pages.dev, see frontend/functions/); firstpr-web only redirects there.
services:
  - type: web
    name: firstpr-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free  # sleeps after ~15 min idle; first request then takes ~30-60 s
    region: singapore  # closest Render region to the Supabase DB in Mumbai
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL  # Supabase pooler URL, entered in the dashboard
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # GitHub sign-in (see backend/.env.example). Values are entered in the dashboard.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APP_URL  # the website: sign-in returns here
        value: https://firstpr.pages.dev
      # Error reports (sentry.io). Leave SENTRY_DSN empty to send nothing.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: web
    name: firstpr-web
    runtime: static
    rootDir: frontend
    # Only a "we've moved" page now; the app itself is built by Cloudflare Pages.
    buildCommand: echo "publishing the moved page"
    staticPublishPath: moved
    routes:
      # The site moved to Cloudflare Pages (2026-11-17). Old links keep working:
      # every path, /api included, redirects to the same path there.
      - type: redirect
        source: /*
        destination: https://firstpr.pages.dev/*
