# Daily sync: copies fresh good-first-issues from GitHub into Supabase.
# Also runnable by hand: Actions tab -> Sync -> Run workflow.
#
# Repo secrets needed (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL        Supabase session-pooler URL (same as backend/.env)
#   SYNC_GITHUB_TOKEN   your fine-grained PAT (secret names can't start with GITHUB_)
name: Sync

on:
  schedule:
    - cron: "30 2 * * *"  # 02:30 UTC = 08:00 IST, daily
  workflow_dispatch:
    inputs:
      limit:
        description: Max issues to look at per language
        default: "300"

# Never run two syncs at once: they would share one rate limit and slow each other down.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Time plan (2026-11-16 the sync took 127 of 150 minutes and CI killed the re-check):
    #   re-check  budget 30 min, hard stop 40 (step timeout)
    #   sync      budget 85 min, hard stop 100; the language in progress may run past the budget
    # Each job stops itself at its budget; the hard stops are only a backstop.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
      # Optional: a crashed sync is reported to Sentry. Unset = no reports.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Editable, so the code finds ml/difficulty_model.joblib in this checkout.
      # The `ml` extras bring scikit-learn for scoring issues with the model.
      - run: pip install -e ".[ml]"
      - name: Apply pending migrations
        run: alembic upgrade head
      # First: hiding closed and taken issues matters more than adding new ones, so it never
      # gets only the time the sync leaves over.
      - name: Re-check stored issues (closed, assigned, claimed, linked PR)
        timeout-minutes: 40
        run: python -m app.sync.recheck --max 2000 --max-minutes 30
      # Runs even if the re-check failed. Starts from a different language each day, so the
      # budget doesn't always cut the same ones.
      - name: Sync
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        run: >-
          python -m app.sync.run
          --language python --language javascript --language typescript
          --language go --language rust --language java --language "c++"
          --language "c#" --language ruby --language php
          --limit ${{ inputs.limit || '300' }}
          --max-minutes 85
